name: Release

# Builds an immutable, versioned distribution artifact so consumers can PIN a
# release instead of reading a moving `main` (AUD-07). Produces:
#   - vinuchain.tokenlist.json  (Uniswap-tokenlist format, logoURIs pinned to the tag)
#   - vinuchain-lists-registry-<tag>.tar.gz  (tokens/ + contracts/ + schemas/)
#   - SHA256SUMS  (checksums of both artifacts)
# all attached to a GitHub Release.
#
# Three ways in:
#   1. push of a v* tag        — an explicit, hand-cut release (the original path)
#   2. push to main touching   — auto-cut a patch release, so the published
#      registry data              artifact never falls behind `main`. Without this
#                                 the artifact silently rots: v1.2.0 sat for seven
#                                 weeks still serving a logo URL whose host had
#                                 gone dead, while `main` had the fix.
#   3. workflow_dispatch       — manual re-run, optionally at a chosen version
#
# The release is published directly rather than by pushing a tag and letting
# case 1 pick it up: a tag pushed with GITHUB_TOKEN does not trigger another
# workflow run, so that indirection would silently never release. For cases 2
# and 3 the tag is created by this run, immediately before publishing, and
# removed again if publishing fails.
#
# Note on filtering: "only release when registry data changed" is enforced by a
# step inside the job, not by an `on.push.paths` filter. A single push trigger
# applies its paths filter to tags as well as branches, which would make a
# hand-cut v* tag fail to release unless that tag's commit happened to touch
# registry data. The in-job check keeps the two paths independent.
on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v1.3.0). Leave blank to bump the patch.'
        required: false
        type: string

permissions:
  contents: write

# Never let two releases race to claim the same version number.
concurrency:
  # Main pushes supersede older pending main pushes (the newest commit contains
  # their registry changes), but a tag/manual run must never evict that pending
  # freshness release. Deliberate runs get unique groups; atomic tag reservation
  # below serializes the version namespace across groups.
  group: release-${{ github.event_name == 'push' && github.ref_type == 'branch' && 'main' || github.run_id }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          # Full history + tags: the version bump reads the existing tag list,
          # and a shallow clone would see none of it.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'

      # Only registry *data* warrants a new artifact. Edits to scripts, tests or
      # docs do not change what consumers read, so they must not cut a release.
      # Tag pushes and manual runs are always honoured — they are deliberate.
      - name: Decide whether to release
        id: gate
        run: |
          set -euo pipefail

          # A push event is also emitted when a tag is deleted. Never turn that
          # deletion into a release run: checkout then points at the default
          # branch and could recreate an old version with today's bytes.
          if [ "${DELETED}" = "true" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Ref deletion; not a release."
            exit 0
          fi

          if [ "${GITHUB_EVENT_NAME}" != "push" ] || [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "Deliberate release (${GITHUB_EVENT_NAME}/${GITHUB_REF_TYPE}); proceeding."
            exit 0
          fi

          # On a branch push, compare against the previous tip. The base can be
          # genuinely unusable: a branch creation reports an all-zero SHA, and
          # after a force push the old tip may be unreachable and so absent from
          # even a full clone. Probe for the object rather than letting `git
          # diff` fail, because a failed diff is indistinguishable from an empty
          # one and would silently skip a real registry change.
          #
          # When the base is unusable, release unconditionally. Narrowing to
          # HEAD~1 would be wrong: such a push can carry many commits, and
          # judging the whole push by its last commit skips the release whenever
          # that one happens to be docs-only. A redundant patch release is
          # cheap; a missed one leaves the published artifact stale, which is
          # the exact failure this automation exists to prevent.
          if [ -z "${BEFORE_SHA}" ] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "Base ${BEFORE_SHA:-<none>} unavailable; releasing without a change check."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED="$(git diff --name-only "${BEFORE_SHA}" HEAD)"

          # Registry data is the obvious trigger, but the tokenlist builder and
          # the JSON reader it depends on also determine the published artifact's
          # contents — a builder-only fix must not sit unreleased until some
          # unrelated data change happens along. Extend this list if the builder
          # gains another local dependency.
          if echo "${CHANGED}" | grep -qE '^(tokens|contracts|schemas)/|^scripts/build-tokenlist\.js$|^scripts/utils/safe-json\.js$'; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "Release-relevant files changed; cutting a release."
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing release-relevant changed; skipping release."
          fi
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          BEFORE_SHA: ${{ github.event.before }}
          DELETED: ${{ github.event.deleted }}

      - name: Resolve release version
        id: version
        if: steps.gate.outputs.proceed == 'true'
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # Hand-cut release: the tag already exists and names the version.
            TAG="${GITHUB_REF_NAME}"
            CREATE_TAG=false

            if ! git show-ref --verify --quiet "refs/tags/${TAG}"; then
              echo "::error::Tag event ${TAG} is absent from the checkout."
              exit 1
            fi

            TAG_COMMIT="$(git rev-parse "${TAG}^{commit}")"
            HEAD_COMMIT="$(git rev-parse HEAD)"
            if [ "${TAG_COMMIT}" != "${HEAD_COMMIT}" ]; then
              echo "::error::Tag ${TAG} resolves to ${TAG_COMMIT}, but checkout is ${HEAD_COMMIT}."
              exit 1
            fi
          elif [ -n "${INPUT_VERSION}" ]; then
            TAG="${INPUT_VERSION}"
            CREATE_TAG=true
          else
            # Bump the patch of the highest existing v-tag. `--sort=-v:refname`
            # orders numerically, so v1.10.0 correctly outranks v1.9.0.
            LATEST="$(
              git tag -l 'v*' --sort=-v:refname \
                | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
                | head -n1 \
                || true
            )"
            if [ -z "${LATEST}" ]; then
              TAG="v1.0.0"
            else
              VER="${LATEST#v}"
              MAJOR="$(echo "${VER}" | cut -d. -f1)"
              MINOR="$(echo "${VER}" | cut -d. -f2)"
              PATCH="$(echo "${VER}" | cut -d. -f3)"
              TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
            fi
            CREATE_TAG=true
          fi

          # A malformed tag would propagate into the artifact version, the
          # archive filename and the pinned logo URLs, so reject it up front.
          if ! echo "${TAG}" | grep -qE '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::Version '${TAG}' is not of the form vMAJOR.MINOR.PATCH."
            exit 1
          fi

          # Refuse to overwrite an existing release rather than silently
          # republishing different bytes under a version consumers have pinned.
          if [ "${CREATE_TAG}" = "true" ] && git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} already exists; refusing to overwrite a published release."
            exit 1
          fi

          # A release version is immutable even if somebody force-moves or
          # re-pushes its tag. softprops updates existing releases and replaces
          # same-named assets by default, so reject a pre-existing release
          # before any build or upload.
          RELEASE_BODY="$(mktemp)"
          set +e
          RELEASE_HTTP="$(curl -sS -o "${RELEASE_BODY}" -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          RELEASE_CURL_STATUS=$?
          set -e

          if [ "${RELEASE_CURL_STATUS}" != "0" ]; then
            echo "::error::Unable to prove whether release ${TAG} exists; refusing to publish."
            exit 1
          fi

          case "${RELEASE_HTTP}" in
            404) ;;
            200)
              echo "::error::Release ${TAG} already exists; immutable versions cannot be republished."
              exit 1
              ;;
            *)
              echo "::error::GitHub returned HTTP ${RELEASE_HTTP} while checking release ${TAG}; refusing to publish."
              exit 1
              ;;
          esac

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "create_tag=${CREATE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG} (create_tag=${CREATE_TAG})"
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install dependencies
        if: steps.gate.outputs.proceed == 'true'
        run: npm ci

      # Gate the release on validation passing, so a release never ships a
      # broken registry. This matters more on the auto path than the manual
      # one: nobody is watching a release that cuts itself.
      - name: Validate registry
        if: steps.gate.outputs.proceed == 'true'
        run: npm run validate

      # The on-chain cross-check is the AUD-01 defense (substituted-but-
      # checksummed addresses); a release artifact must never ship without it.
      - name: On-chain cross-check
        if: steps.gate.outputs.proceed == 'true'
        run: npm run validate:onchain

      - name: Build pinned tokenlist
        if: steps.gate.outputs.proceed == 'true'
        env:
          REF: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p dist
          # Pin the artifact timestamp to the released commit's time so the same
          # tag always rebuilds byte-identically (reproducible releases).
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct HEAD)"
          node scripts/build-tokenlist.js --out dist/vinuchain.tokenlist.json --ref "$REF"

      - name: Bundle registry data
        if: steps.gate.outputs.proceed == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Pin the archive timestamp to the released commit's time so the same
          # tag always rebuilds byte-identically. --sort=name gives a stable
          # traversal order; --owner/--group/--numeric-owner strip UID/GID
          # metadata; gzip -n suppresses the embedded filename+mtime header.
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct HEAD)"
          tar --sort=name \
              --mtime="@${SOURCE_DATE_EPOCH}" \
              --owner=0 --group=0 --numeric-owner \
              -cf - tokens contracts schemas \
            | gzip -n > "dist/vinuchain-lists-registry-${TAG}.tar.gz"

      - name: Generate checksums
        if: steps.gate.outputs.proceed == 'true'
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # Claim the version immediately before publishing, not when it was
      # resolved: validation and the build take minutes, and a maintainer
      # pushing the same tag in that window would leave the tag pointing at
      # their commit while this run uploaded artifacts built from a different
      # one (GitHub ignores target_commitish for an existing tag). `git push`
      # of a new ref is atomic and rejected if the name is taken, so losing the
      # race fails this run instead of publishing a mismatched release.
      - name: Reserve release tag
        id: reserve
        if: steps.gate.outputs.proceed == 'true' && steps.version.outputs.create_tag == 'true'
        run: |
          set -euo pipefail
          CANDIDATE="${TAG}"

          for attempt in $(seq 1 5); do
            git tag "${CANDIDATE}" "${COMMIT_SHA}"
            if git push origin "refs/tags/${CANDIDATE}"; then
              break
            fi

            git tag -d "${CANDIDATE}"

            # An explicit requested version is immutable: never silently
            # renumber it. Automatic patch releases can safely choose the next
            # version after losing an atomic tag race.
            if [ -n "${INPUT_VERSION}" ]; then
              echo "::error::Could not claim explicit version ${CANDIDATE}."
              exit 1
            fi

            git fetch --force --tags origin
            LATEST="$(
              git tag -l 'v*' --sort=-v:refname \
                | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
                | head -n1 \
                || true
            )"
            VER="${LATEST#v}"
            MAJOR="$(echo "${VER}" | cut -d. -f1)"
            MINOR="$(echo "${VER}" | cut -d. -f2)"
            PATCH="$(echo "${VER}" | cut -d. -f3)"
            CANDIDATE="v${MAJOR}.${MINOR}.$((10#${PATCH} + 1))"
          done

          if ! git show-ref --verify --quiet "refs/tags/${CANDIDATE}"; then
            echo "::error::Could not reserve a release version after 5 attempts."
            exit 1
          fi

          # The build ran before the atomic claim to avoid holding a version
          # while validation was in progress. If a competing run won that
          # version, rebuild every version-bearing artifact for the replacement
          # tag before publishing it.
          if [ "${CANDIDATE}" != "${TAG}" ]; then
            rm -rf dist
            mkdir -p dist
            export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct HEAD)"
            node scripts/build-tokenlist.js \
              --out dist/vinuchain.tokenlist.json \
              --ref "${CANDIDATE}"
            tar --sort=name \
                --mtime="@${SOURCE_DATE_EPOCH}" \
                --owner=0 --group=0 --numeric-owner \
                -cf - tokens contracts schemas \
              | gzip -n > "dist/vinuchain-lists-registry-${CANDIDATE}.tar.gz"
            (
              cd dist
              sha256sum vinuchain.tokenlist.json \
                "vinuchain-lists-registry-${CANDIDATE}.tar.gz" > SHA256SUMS
            )
          fi

          # Recorded only after the push succeeds. Cleanup keys off this, so a
          # run that lost the race never deletes the winner's tag.
          echo "reserved=true" >> "$GITHUB_OUTPUT"
          echo "tag=${CANDIDATE}" >> "$GITHUB_OUTPUT"
          echo "Claimed ${CANDIDATE} at ${COMMIT_SHA}."
        env:
          TAG: ${{ steps.version.outputs.tag }}
          COMMIT_SHA: ${{ github.sha }}
          INPUT_VERSION: ${{ inputs.version }}

      - name: Verify final release is unused
        if: steps.gate.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          BODY="$(mktemp)"
          set +e
          HTTP_STATUS="$(curl -sS -o "${BODY}" -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          CURL_STATUS=$?
          set -e

          if [ "${CURL_STATUS}" != "0" ]; then
            echo "::error::Unable to prove whether final release ${TAG} exists; refusing to publish."
            exit 1
          fi

          case "${HTTP_STATUS}" in
            404) ;;
            200)
              echo "::error::Final release ${TAG} already exists; immutable versions cannot be republished."
              exit 1
              ;;
            *)
              echo "::error::GitHub returned HTTP ${HTTP_STATUS} while checking final release ${TAG}; refusing to publish."
              exit 1
              ;;
          esac
        env:
          TAG: ${{ steps.reserve.outputs.tag || steps.version.outputs.tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}

      # Create the draft in a separate successful step so its exact API id is
      # durable even when the uploader fails halfway through. The release
      # action below discovers this draft, uploads into it, and publishes only
      # after every asset succeeds.
      - name: Create owned draft release
        id: draft
        if: steps.gate.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          PAYLOAD="$(mktemp)"
          RESPONSE="$(mktemp)"
          jq -n \
            --arg tag "${TAG}" \
            --arg sha "${COMMIT_SHA}" \
            --arg marker "${RUN_MARKER}" \
            '{
              tag_name: $tag,
              target_commitish: $sha,
              name: $tag,
              body: $marker,
              draft: true,
              prerelease: false,
              generate_release_notes: true
            }' > "${PAYLOAD}"

          set +e
          HTTP_STATUS="$(curl -sS -o "${RESPONSE}" -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data-binary "@${PAYLOAD}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases")"
          CURL_STATUS=$?
          set -e

          if [ "${CURL_STATUS}" != "0" ] || [ "${HTTP_STATUS}" != "201" ]; then
            echo "::error::Unable to create an owned draft for ${TAG}; refusing to upload."
            exit 1
          fi

          RELEASE_ID="$(jq -r '.id // empty' "${RESPONSE}")"
          RELEASE_TAG="$(jq -r '.tag_name // empty' "${RESPONSE}")"
          RELEASE_DRAFT="$(jq -r '.draft // empty' "${RESPONSE}")"
          if ! echo "${RELEASE_ID}" | grep -qE '^[1-9][0-9]*$' \
            || [ "${RELEASE_TAG}" != "${TAG}" ] \
            || [ "${RELEASE_DRAFT}" != "true" ]; then
            echo "::error::GitHub returned an invalid draft-release identity; refusing to upload."
            exit 1
          fi

          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"
          echo "Created owned draft release ${RELEASE_ID} for ${TAG}."
        env:
          TAG: ${{ steps.reserve.outputs.tag || steps.version.outputs.tag }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_MARKER: Automated registry release from ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Create GitHub Release
        id: publish
        if: steps.gate.outputs.proceed == 'true'
        # softprops/action-gh-release@v2.0.8 — pinned by commit SHA.
        # `tag_name` + `target_commitish` make the action create the tag itself
        # at the released commit when it does not already exist.
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b
        with:
          tag_name: ${{ steps.reserve.outputs.tag || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: Automated registry release from ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: |
            dist/vinuchain.tokenlist.json
            dist/vinuchain-lists-registry-*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: false

      # If publishing fails, delete only this run's owned draft/release. An
      # automatically reserved tag can then be freed too; a hand-cut tag is
      # always preserved.
      - name: Clean up failed owned release
        if: always() && steps.gate.outputs.proceed == 'true' && steps.publish.outcome != 'success' && (steps.draft.outcome != 'skipped' || steps.reserve.outputs.reserved == 'true')
        env:
          TAG: ${{ steps.reserve.outputs.tag || steps.version.outputs.tag }}
          COMMIT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
          RESERVED: ${{ steps.reserve.outputs.reserved }}
          DRAFT_OUTCOME: ${{ steps.draft.outcome }}
          RUN_MARKER: Automated registry release from ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # Delete only the exact release id created by this run, after proving
          # its tag and run marker still match. This makes an interrupted upload
          # recoverable without risking another maintainer's release.
          OWNED_RELEASE_ID="${RELEASE_ID}"
          if [ -z "${OWNED_RELEASE_ID}" ] && [ "${DRAFT_OUTCOME}" != "skipped" ]; then
            # The POST can succeed server-side while curl loses its response.
            # Recover only an entity carrying this exact run marker and tag.
            RELEASES_BODY="$(mktemp)"
            set +e
            RELEASES_HTTP="$(curl -sS -o "${RELEASES_BODY}" -w '%{http_code}' \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
            RELEASES_CURL_STATUS=$?
            set -e

            if [ "${RELEASES_CURL_STATUS}" != "0" ] || [ "${RELEASES_HTTP}" != "200" ]; then
              echo "::warning::Could not search for an ambiguously created release; leaving all state intact."
              exit 0
            fi

            MATCH_COUNT="$(
              jq --arg tag "${TAG}" --arg marker "${RUN_MARKER}" \
                '[.[] | select(.tag_name == $tag and ((.body // "") | contains($marker)))] | length' \
                "${RELEASES_BODY}"
            )"
            if [ "${MATCH_COUNT}" = "1" ]; then
              OWNED_RELEASE_ID="$(
                jq -r --arg tag "${TAG}" --arg marker "${RUN_MARKER}" \
                  '.[] | select(.tag_name == $tag and ((.body // "") | contains($marker))) | .id' \
                  "${RELEASES_BODY}"
              )"
            elif [ "${MATCH_COUNT}" != "0" ]; then
              echo "::warning::Found ${MATCH_COUNT} run-marked releases for ${TAG}; leaving all state intact."
              exit 0
            fi
          fi

          if [ -n "${OWNED_RELEASE_ID}" ]; then
            OWNED_BODY="$(mktemp)"
            set +e
            OWNED_HTTP="$(curl -sS -o "${OWNED_BODY}" -w '%{http_code}' \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${OWNED_RELEASE_ID}")"
            OWNED_CURL_STATUS=$?
            set -e

            if [ "${OWNED_CURL_STATUS}" != "0" ] || [ "${OWNED_HTTP}" != "200" ]; then
              echo "::warning::Could not verify owned release ${OWNED_RELEASE_ID}; leaving release and tag intact."
              exit 0
            fi

            OWNED_TAG="$(jq -r '.tag_name // empty' "${OWNED_BODY}")"
            OWNED_MARKER="$(jq -r '.body // empty' "${OWNED_BODY}")"
            if [ "${OWNED_TAG}" != "${TAG}" ] || [[ "${OWNED_MARKER}" != *"${RUN_MARKER}"* ]]; then
              echo "::warning::Release ${OWNED_RELEASE_ID} no longer matches this run; leaving it and tag ${TAG} intact."
              exit 0
            fi

            set +e
            DELETE_HTTP="$(curl -sS -o /dev/null -w '%{http_code}' \
              -X DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${OWNED_RELEASE_ID}")"
            DELETE_CURL_STATUS=$?
            set -e

            if [ "${DELETE_CURL_STATUS}" != "0" ] || [ "${DELETE_HTTP}" != "204" ]; then
              echo "::warning::Could not delete owned release ${OWNED_RELEASE_ID}; leaving tag ${TAG} intact."
              exit 0
            fi
            echo "Removed owned failed release ${OWNED_RELEASE_ID}."
          fi

          if [ "${RESERVED}" != "true" ]; then
            echo "Preserving hand-cut tag ${TAG}."
            exit 0
          fi

          REMOTE_SHA="$(git ls-remote origin "refs/tags/${TAG}" | cut -f1)"
          if [ -z "${REMOTE_SHA}" ]; then
            echo "Reserved tag ${TAG} is already absent."
            exit 0
          fi

          # Never delete a tag someone else legitimately moved meanwhile.
          if [ "${REMOTE_SHA}" != "${COMMIT_SHA}" ]; then
            echo "Tag ${TAG} points at ${REMOTE_SHA}, not ${COMMIT_SHA}; leaving it alone."
            exit 0
          fi

          # Delete the tag only after an authoritative 404 proves no release
          # remains. Any timeout, auth problem, or 5xx leaves it intact.
          RELEASE_BODY="$(mktemp)"
          set +e
          RELEASE_HTTP="$(curl -sS -o "${RELEASE_BODY}" -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          RELEASE_CURL_STATUS=$?
          set -e

          if [ "${RELEASE_CURL_STATUS}" != "0" ]; then
            echo "::warning::Could not prove release ${TAG} is absent; leaving its tag intact."
            exit 0
          fi

          case "${RELEASE_HTTP}" in
            200)
              echo "::warning::A release for ${TAG} still exists; leaving its tag intact for manual review."
              exit 0
              ;;
            404) ;;
            *)
              echo "::warning::GitHub returned HTTP ${RELEASE_HTTP}; leaving tag ${TAG} intact."
              exit 0
              ;;
          esac

          git push origin ":refs/tags/${TAG}"
          echo "Removed unused tag ${TAG}."
