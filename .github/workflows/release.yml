name: Release

# On a v* tag push, build an immutable, versioned distribution artifact so
# consumers can PIN a release instead of reading a moving `main` (AUD-07).
# Produces:
#   - vinuchain.tokenlist.json  (Uniswap-tokenlist format, logoURIs pinned to the tag)
#   - vinuchain-lists-registry-<tag>.tar.gz  (tokens/ + contracts/ + schemas/)
#   - SHA256SUMS  (checksums of both artifacts)
# all attached to a GitHub Release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      # Gate the release on validation passing, so a tag never ships a broken
      # registry.
      - name: Validate registry
        run: npm run validate

      # The on-chain cross-check is the AUD-01 defense (substituted-but-
      # checksummed addresses); a release artifact must never ship without it.
      - name: On-chain cross-check
        run: npm run validate:onchain

      - name: Build pinned tokenlist
        env:
          REF: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          # Pin the artifact timestamp to the tagged commit's time so the same
          # tag always rebuilds byte-identically (reproducible releases).
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct HEAD)"
          node scripts/build-tokenlist.js --out dist/vinuchain.tokenlist.json --ref "$REF"

      - name: Bundle registry data
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Pin the archive timestamp to the tagged commit's time so the same
          # tag always rebuilds byte-identically. --sort=name gives a stable
          # traversal order; --owner/--group/--numeric-owner strip UID/GID
          # metadata; gzip -n suppresses the embedded filename+mtime header.
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct HEAD)"
          tar --sort=name \
              --mtime="@${SOURCE_DATE_EPOCH}" \
              --owner=0 --group=0 --numeric-owner \
              -cf - tokens contracts schemas \
            | gzip -n > "dist/vinuchain-lists-registry-${TAG}.tar.gz"

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        # softprops/action-gh-release@v2.0.8 — pinned by commit SHA.
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b
        with:
          files: |
            dist/vinuchain.tokenlist.json
            dist/vinuchain-lists-registry-*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
