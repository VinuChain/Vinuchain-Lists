name: Release

# On a v* tag push, build an immutable, versioned distribution artifact so
# consumers can PIN a release instead of reading a moving `main` (AUD-07).
# Produces:
#   - vinuchain.tokenlist.json  (Uniswap-tokenlist format, logoURIs pinned to the tag)
#   - vinuchain-lists-registry-<tag>.tar.gz  (tokens/ + contracts/ + schemas/)
#   - SHA256SUMS  (checksums of both artifacts)
# all attached to a GitHub Release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      # Gate the release on validation passing, so a tag never ships a broken
      # registry.
      - name: Validate registry
        run: npm run validate

      - name: Build pinned tokenlist
        env:
          REF: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          node scripts/build-tokenlist.js --out dist/vinuchain.tokenlist.json --ref "$REF"

      - name: Bundle registry data
        env:
          TAG: ${{ github.ref_name }}
        run: |
          tar -czf "dist/vinuchain-lists-registry-${TAG}.tar.gz" tokens contracts schemas

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        # softprops/action-gh-release@v2.0.8 — pinned by commit SHA.
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191
        with:
          files: |
            dist/vinuchain.tokenlist.json
            dist/vinuchain-lists-registry-*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
