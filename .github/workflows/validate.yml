name: Validate Submissions

# Runs on every PR and push to main with NO paths filter: a change to the
# validator itself (scripts/**), the test suite (tests/**), the schemas, the
# dependency manifest, or the workflows MUST be gated by the same checks as a
# data change. The old paths filter (tokens/**, contracts/**, schemas/**) let a
# PR editing scripts/validate.js merge without ever running validation — the
# exact files that run with the production oracle key attached (AUD-02).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Avoid piling up redundant runs on rapid pushes; cancel superseded runs.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate JSON and Contract Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        # actions/checkout@v4.2.2 — pinned by commit SHA to prevent a
        # compromised/hijacked floating tag from injecting code into CI (AUD-09).
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Node.js
        # actions/setup-node@v4.4.0 — pinned by commit SHA (see above).
        # No `cache:` — the GitHub Actions cache API is intentionally unused.
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run validation
        run: npm run validate

      - name: Check JSON formatting
        run: |
          # Check all JSON files are properly formatted
          find tokens contracts schemas -name "*.json" -type f -exec sh -c '
            for file; do
              if ! jq empty "$file" 2>/dev/null; then
                echo "❌ Invalid JSON in $file"
                exit 1
              fi
            done
          ' sh {} +

  test:
    name: Run Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      # The 2,600-line mocha + hardhat suite (unit, security, integration) is
      # the registry's security boundary. It was never executed in CI before
      # (AUD-03); regressions in the validators would have shipped silently.
      - name: Run mocha tests (unit, security, integration)
        run: npm run test:mocha

      - name: Run hardhat behavioural tests
        run: npm run test:hardhat

  onchain:
    name: On-chain Cross-check
    runs-on: ubuntu-latest
    # BLOCKING: this is the AUD-01 defense — a deliberately substituted but
    # correctly-checksummed address passes every off-chain check and only this
    # job catches it, so it must gate merges. Flake tolerance lives inside the
    # validator, in the right places: testnet (206) outages are skipped with a
    # loud warning, and each chain probes multiple RPC endpoints before
    # failing. A hard failure here means a real mismatch or a full mainnet RPC
    # outage — both are reasons not to merge registry changes.

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      # Asserts every entry's address has code on the chain it declares (and that
      # token decimals/symbol match) against the live RPC. Catches a deliberately
      # substituted-but-checksummed address that all off-chain checks miss.
      - name: Run on-chain cross-check
        run: npm run validate:onchain

  comment:
    name: Comment on PR
    runs-on: ubuntu-latest
    needs: [validate, test, onchain]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Comment success
        if: success()
        # actions/github-script@v7.0.1 — pinned by commit SHA (AUD-09).
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ All validations and tests passed! This submission looks good.'
            })

      - name: Comment failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Validation or tests failed. Please check the errors above and update your submission.'
            })
