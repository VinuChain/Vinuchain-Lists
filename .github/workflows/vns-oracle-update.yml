name: Update VNS VC/USD Oracle

on:
  schedule:
    # Every 4 hours at :17 past the hour. The updater reads the live maxAge
    # from deployment metadata by default, and this cadence also leaves a
    # three-run buffer under the hardened 12h deployment default.
    - cron: '17 */4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - send
      allow_single_source:
        description: 'Force single-source/advisory-pool fallback on a manual run (schedule already allows it on testnet)'
        required: true
        default: false
        type: boolean

concurrency:
  group: vns-oracle-update
  cancel-in-progress: false

jobs:
  update:
    name: Update oracle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Required reviewers + secret scoping live on the `vns-oracle-prod`
    # GitHub Environment. The repo admin must create this environment
    # manually under Settings -> Environments and attach the
    # VNS_ORACLE_PRIVATE_KEY secret there (not at repo level) plus a
    # required-reviewers protection rule.
    environment: vns-oracle-prod
    permissions:
      contents: read
      issues: write

    env:
      VNS_USD_ORACLE_ADDRESS: '0xde7931dCA452Be9647e4AF13C92edCFac1f26d52'
      VNS_ORACLE_CHAIN_ID: '206'
      VNS_PRICE_CHAIN_ID: '207'
      # Pool guard is OFF on testnet: the VinuSwap V3 pool used for the TWAP
      # cross-check froze at byte-identical values for >18 h on 2026-05-20
      # because testnet liquidity is too thin to keep the TWAP moving.
      # The guard is a manipulation protection for mainnet; on testnet
      # (chain 206), there are no real funds at risk, so the guard adds
      # operational fragility without protecting anything. Re-enable when
      # the VNS stack is deployed on mainnet.
      VNS_ORACLE_REQUIRE_POOL_GUARD: '0'
      # Ordered comma/newline/space-separated RPC fallbacks. The updater
      # health-checks each endpoint with chainId + blockNumber before using it,
      # so operators can add a temporary chain-206 fallback without a code
      # deploy when the official testnet ELB is unavailable.
      VNS_ORACLE_RPC_URLS: ${{ vars.VNS_ORACLE_RPC_URLS || vars.VNS_ORACLE_RPC_URL || 'https://vinufoundation-rpc.com' }}
      VNS_PRICE_RPC_URLS: ${{ vars.VNS_PRICE_RPC_URLS || vars.VNS_PRICE_RPC_URL || 'https://rpc.vinuchain.org' }}
      # Testnet posture: the VinuSwap V3 TWAP cross-check is ADVISORY here (thin
      # liquidity makes it lag/freeze vs the real VC price). The scheduled cron
      # therefore allows CoinGecko-only / deviation-fallback so a lagging pool
      # can't fail the run (it would otherwise go stale and re-open the cron
      # failure issue). Manual dispatch can still force the strict both-sources
      # check by leaving 'allow_single_source' unchecked. Backstop: when the
      # target chain is mainnet (207) the updater forces STRICT regardless of
      # these flags (both a source disagreement and a missing pool hard-fail),
      # so even a mainnet copy of this workflow cannot push an unguarded price.
      VNS_ORACLE_ALLOW_SINGLE_SOURCE: ${{ (github.event_name == 'schedule' || inputs.allow_single_source == true) && '1' || '0' }}
      # Source-disagreement cap. Default 500 bps (5%) is the steady-state
      # operating ceiling; expose as a `vars.VNS_ORACLE_MAX_DEVIATION_BPS`
      # repo variable so operators can widen it during thin-pool TWAP
      # periods without a code change. Walking past 1000 bps (10%) requires
      # script-level review — manipulate-or-misprice risk grows past that.
      VNS_ORACLE_MAX_DEVIATION_BPS: ${{ vars.VNS_ORACLE_MAX_DEVIATION_BPS || '500' }}

    steps:
      - name: Checkout code
        # actions/checkout@v4.2.2 — pinned by commit SHA to prevent a
        # compromised maintainer from re-pointing the v4 floating tag.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Node.js
        # actions/setup-node@v4.4.0 — pinned by commit SHA (see above).
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dry-run price resolution
        run: npm run vns:oracle:dry-run

      - name: Submit oracle update
        if: github.event_name == 'schedule' || inputs.mode == 'send'
        env:
          VNS_ORACLE_PRIVATE_KEY: ${{ secrets.VNS_ORACLE_PRIVATE_KEY }}
        run: npm run vns:oracle:update

      - name: Report failure (deduped GH issue)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Dedup: if there's already an open issue with the same label, just
          # comment on it instead of creating a new one. Three consecutive
          # failures will accumulate three comments on the same issue, which
          # gives operators a single page to track the incident.
          LABEL='oracle-cron-failure'
          gh label create "$LABEL" --color B60205 --description 'VNS oracle update workflow failed' --force >/dev/null 2>&1 || true
          OPEN_ISSUE=$(gh issue list --state open --label "$LABEL" --limit 1 --json number --jq '.[0].number' || echo '')
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY=$(printf 'Workflow run failed at %s.\n\n- Run: %s\n- Trigger: %s\n- Attempt: %s\n\nThe runbook is in VinuChain-Docs/technical-docs/smart-contracts/vinuchain-name-service.md "Oracle refresh runbook".' \
                       "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$RUN_URL" "${{ github.event_name }}" "${{ github.run_attempt }}")
          if [ -n "$OPEN_ISSUE" ]; then
            gh issue comment "$OPEN_ISSUE" --body "$BODY"
          else
            gh issue create --title 'VNS oracle update workflow failed' --label "$LABEL" --body "$BODY"
          fi
