name: Update VNS VC/USD Oracle

on:
  schedule:
    # Every 4 hours at :17 past the hour. The updater reads the live maxAge
    # from deployment metadata by default, and this cadence also leaves a
    # three-run buffer under the hardened 12h deployment default.
    - cron: '17 */4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - send
      allow_single_source:
        description: 'Emergency only: allow CoinGecko or guarded pool fallback alone'
        required: true
        default: false
        type: boolean

concurrency:
  group: vns-oracle-update
  cancel-in-progress: false

jobs:
  update:
    name: Update oracle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Required reviewers + secret scoping live on the `vns-oracle-prod`
    # GitHub Environment. The repo admin must create this environment
    # manually under Settings -> Environments and attach the
    # VNS_ORACLE_PRIVATE_KEY secret there (not at repo level) plus a
    # required-reviewers protection rule.
    environment: vns-oracle-prod
    permissions:
      contents: read

    env:
      VNS_USD_ORACLE_ADDRESS: '0xde7931dCA452Be9647e4AF13C92edCFac1f26d52'
      VNS_ORACLE_CHAIN_ID: '206'
      VNS_PRICE_CHAIN_ID: '207'
      VNS_ORACLE_REQUIRE_POOL_GUARD: '1'
      VNS_ORACLE_RPC_URL: ${{ vars.VNS_ORACLE_RPC_URL || 'https://vinufoundation-rpc.com' }}
      VNS_PRICE_RPC_URL: ${{ vars.VNS_PRICE_RPC_URL || 'https://vinuchain-rpc.com' }}
      VNS_ORACLE_ALLOW_SINGLE_SOURCE: ${{ inputs.allow_single_source == true && '1' || '0' }}
      # Source-disagreement cap. Default 500 bps (5%) is the steady-state
      # operating ceiling; expose as a `vars.VNS_ORACLE_MAX_DEVIATION_BPS`
      # repo variable so operators can widen it during thin-pool TWAP
      # periods without a code change. Walking past 1000 bps (10%) requires
      # script-level review — manipulate-or-misprice risk grows past that.
      VNS_ORACLE_MAX_DEVIATION_BPS: ${{ vars.VNS_ORACLE_MAX_DEVIATION_BPS || '500' }}

    steps:
      - name: Checkout code
        # actions/checkout@v4.2.2 — pinned by commit SHA to prevent a
        # compromised maintainer from re-pointing the v4 floating tag.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        # actions/setup-node@v4.4.0 — pinned by commit SHA (see above).
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dry-run price resolution
        run: npm run vns:oracle:dry-run

      - name: Submit oracle update
        if: github.event_name == 'schedule' || inputs.mode == 'send'
        env:
          VNS_ORACLE_PRIVATE_KEY: ${{ secrets.VNS_ORACLE_PRIVATE_KEY }}
        run: npm run vns:oracle:update
