name: Submit a dApp
description: List your dApp in the VinuExplorer marketplace directory
title: "[dApp] "
labels: ["submission", "marketplace"]
body:
  - type: markdown
    attributes:
      value: |
        ## Submit a dApp to the VinuExplorer Marketplace

        Use this form to request a listing for your dApp in the VinuExplorer marketplace directory.

        **How it works:**
        - Approved submissions are added to `contracts/{slug}/info.json` in this repository
        - The marketplace directory is automatically generated from these entries and consumed by [VinuExplorer](https://mainnet.vinuexplorer.org)
        - Please ensure all URLs are publicly accessible and the project is deployed on VinuChain

  - type: markdown
    attributes:
      value: |
        ### Project Information

  - type: input
    id: project_slug
    attributes:
      label: Project Slug
      description: URL-safe identifier for your dApp (lowercase letters, digits, and hyphens only, e.g. "my-dapp")
      placeholder: "my-dapp"
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: dApp Title
      description: Full display name shown in the marketplace
      placeholder: "My dApp"
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: dApp URL
      description: Primary HTTPS URL for the dApp
      placeholder: "https://mydapp.example.com"
    validations:
      required: true

  - type: input
    id: logo
    attributes:
      label: Logo URL
      description: Direct HTTPS link to your dApp logo (SVG or PNG, square recommended)
      placeholder: "https://mydapp.example.com/logo.svg"
    validations:
      required: true

  - type: input
    id: short_description
    attributes:
      label: Short Description
      description: One-line summary shown on marketplace cards (max 160 characters)
      placeholder: "A decentralized exchange on VinuChain."
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Full Description
      description: Detailed description shown on the dApp detail page
      placeholder: "My dApp is a decentralized exchange on VinuChain that..."
    validations:
      required: true

  - type: dropdown
    id: categories
    attributes:
      label: Categories
      description: Select all that apply (up to 5)
      multiple: true
      options:
        - DEX
        - Lending
        - NFT
        - Bridge
        - Governance
        - Staking
        - Tools
        - Other
    validations:
      required: true

  - type: input
    id: author
    attributes:
      label: Author / Organisation
      description: Team or organisation name to display in the marketplace
      placeholder: "My Team"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### Networks

  - type: checkboxes
    id: networks
    attributes:
      label: Networks
      description: Which VinuChain networks should this entry appear on?
      options:
        - label: "Mainnet (Chain ID 207)"
        - label: "Testnet (Chain ID 206)"
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ### Social Links (optional)

  - type: input
    id: twitter
    attributes:
      label: Twitter / X
      description: Twitter/X profile URL
      placeholder: "https://x.com/myproject"
    validations:
      required: false

  - type: input
    id: telegram
    attributes:
      label: Telegram
      description: Telegram group or channel URL
      placeholder: "https://t.me/myproject"
    validations:
      required: false

  - type: input
    id: discord
    attributes:
      label: Discord
      description: Discord server invite URL
      placeholder: "https://discord.gg/myproject"
    validations:
      required: false

  - type: input
    id: github
    attributes:
      label: GitHub
      description: GitHub organisation or repository URL
      placeholder: "https://github.com/my-org"
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      description: Please confirm the following before submitting
      options:
        - label: I am authorised to submit this project information
          required: true
        - label: The dApp is deployed and accessible on VinuChain
          required: true
        - label: All URLs provided are publicly accessible
          required: true
        - label: All information provided is accurate and up-to-date
          required: true
